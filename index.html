<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邱冠超 · 简历</title>
  <style>
    :root {
      --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --c-primary: #2d3e6b;
      --c-accent: #c8946e;
      --c-bg: #faf9f6;
      --c-surface: #fff;
      --c-text: #2c2c2c;
      --c-text2: #5c5c5c;
      --c-border: #e8e5df;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }
    [data-theme="dark"] {
      --c-primary: #9dc0e0;
      --c-accent: #d4a574;
      --c-bg: #1a1d24;
      --c-surface: #22252d;
      --c-text: #e2e2e2;
      --c-text2: #b8b8b8;
      --c-border: #33363e;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);line-height:1.6;transition:background .2s,color .2s}
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:var(--c-bg);border-bottom:1px solid var(--c-border);backdrop-filter:blur(8px)}
    .nav a,.nav button{background:none;border:none;color:var(--c-text2);cursor:pointer;font-size:.88rem;padding:6px 12px;border-radius:18px;transition:.15s;text-decoration:none;font-family:var(--font)}
    .nav a:hover,.nav button:hover{color:var(--c-primary);background:rgba(0,0,0,0.04)}
    [data-theme="dark"] .nav a:hover{background:rgba(255,255,255,0.06)}
    .main{max-width:780px;margin:70px auto 40px;padding:0 20px}
    .hero{text-align:center;padding:40px 20px 30px;background:linear-gradient(160deg, var(--c-bg) 0%, #f0ece4 100%);border-radius:var(--radius);margin-bottom:32px;border:1px solid var(--c-border)}
    [data-theme="dark"] .hero{background:linear-gradient(160deg, #1a1d24 0%, #252830 100%)}
    .avatar{width:72px;height:72px;border-radius:50%;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:2rem;font-weight:700}
    .badge{display:inline-block;padding:4px 14px;border-radius:14px;font-size:.8rem;background:rgba(0,0,0,0.04);margin:4px}
    [data-theme="dark"] .badge{background:rgba(255,255,255,0.08)}
    .badge.accent{background:var(--c-accent);color:#fff}
    .btn{padding:8px 20px;border-radius:20px;font-weight:600;font-size:.9rem;border:1.5px solid var(--c-border);cursor:pointer;transition:.15s;background:var(--c-surface);color:var(--c-text)}
    .btn.primary{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
    .card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:18px;transition:.15s}
    .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .tabs{border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden}
    .tab-btns{display:flex;border-bottom:1px solid var(--c-border);overflow-x:auto}
    .tab-btn{flex:1 0 auto;padding:10px 16px;border:none;background:transparent;font-family:var(--font);font-weight:500;color:var(--c-text2);cursor:pointer;transition:.15s}
    .tab-btn[aria-selected="true"]{color:var(--c-primary);font-weight:700;box-shadow:inset 0 -2px 0 var(--c-accent)}
    .tab-panel{padding:20px;display:none}
    .tab-panel[aria-hidden="false"]{display:block}
    .timeline{padding-left:24px;border-left:2px solid var(--c-border)}
    .timeline-item{margin-bottom:16px;position:relative}
    .timeline-item::before{content:'';position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c-surface);border:2px solid var(--c-accent)}
    .footer{text-align:center;color:var(--c-text2);font-size:.8rem;padding:24px 0;border-top:1px solid var(--c-border);margin-top:32px}
    @media print{nav,.back-top{display:none}.main{margin:0;padding:0}.card,.tabs{box-shadow:none;border:1px solid #ddd}}
    @media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="#hero">邱冠超</a>
    <div style="display:flex;gap:4px;align-items:center">
      <a href="#highlights">亮点</a>
      <a href="#experience">经历</a>
      <a href="#skills">技能</a>
      <a href="#education">教育</a>
      <button id="themeToggle" aria-label="切换深色模式">🌓</button>
      <button id="printBtn" aria-label="打印">🖨️</button>
    </div>
  </nav>

  <main class="main" id="content"></main>
  <footer class="footer" id="footer"></footer>

  <script>
    const resume = {
      name: '邱冠超',
      phone: '136****9877',
      emailUser: 'qiuguancao',
      emailDomain: 'gmail.com',
      headline: '2026届高中毕业生 · 准大一 · 广东工业大学',
      badges: ['深度思考','终身学习','运动自律','沟通协调','活动策划'],
      highlights: [
        { num: '6年', label: '连续班长' },
        { num: '6年', label: '健身自律' },
        { num: '零差错', label: '班级管理' },
        { num: '多项', label: '活动策划' }
      ],
      experience: [
        { role: '班级班长', org: '广州市海珠工业实验中学', date: '2020.09 - 2026.06',
          details: ['班主任与同学间的核心沟通桥梁，协调班委分工，班级事务零差错。','主导校运会入场式、百日誓师等大型活动，提升凝聚力。','擅长分析矛盾根源，制定解决方案，责任心极强。'] }
      ],
      skills: [
        { cat: '核心素质', tags: ['深度思考','结构化思维','逻辑分析','快速学习','抗压能力'] },
        { cat: '管理与协作', tags: ['团队协调','沟通传达','活动策划','冲突调解','责任心'] },
        { cat: '自律体能', tags: ['健身(6年)','游泳','专注力','精力管理'] }
      ],
      education: [
        { title: '广东工业大学', sub: '本科（2026年9月入学）', date: '2026.09 入学', future: true },
        { title: '广州市海珠工业实验中学', sub: '高中', date: '2020.09 - 2026.06' }
      ]
    };

    // 渲染页面
    const main = document.getElementById('content');
    main.innerHTML = `
      <section id="hero" class="hero">
        <div class="avatar">邱</div>
        <h2 style="font-size:1.8rem;margin-bottom:4px">${resume.name}</h2>
        <p style="color:var(--c-text2);margin-bottom:14px">${resume.headline}</p>
        <div>${resume.badges.map((b,i) => `<span class="badge${i===0?' accent':''}">${b}</span>`).join('')}</div>
        <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn" onclick="navigator.clipboard?.writeText('${resume.phone}')">📞 ${resume.phone}</button>
          <button class="btn primary" id="copyEmail">✉️ 复制邮箱</button>
        </div>
      </section>

      <section id="highlights" style="margin-bottom:32px">
        <h3 style="margin-bottom:16px;font-size:1.3rem">📌 亮点成果</h3>
        <div class="grid">
          ${resume.highlights.map(h => `<div class="card" style="text-align:center"><strong style="font-size:1.6rem;color:var(--c-primary)">${h.num}</strong><br><small>${h.label}</small></div>`).join('')}
        </div>
      </section>

      <section id="experience" style="margin-bottom:32px">
        <h3 style="margin-bottom:16px;font-size:1.3rem">💼 校园经历</h3>
        <div class="tabs">
          <div class="tab-btns">
            <button class="tab-btn" aria-selected="true" data-tab="0">班长经历</button>
          </div>
          <div class="tab-panel" aria-hidden="false">
            ${resume.experience.map(exp => `
              <div style="margin-bottom:16px">
                <div style="display:flex;justify-content:space-between;flex-wrap:wrap">
                  <strong>${exp.role}</strong>
                  <small style="color:var(--c-text2)">${exp.date}</small>
                </div>
                <div style="color:var(--c-primary);font-weight:500">${exp.org}</div>
                <ul style="margin-top:8px;padding-left:18px;color:var(--c-text2)">
                  ${exp.details.map(d => `<li>${d}</li>`).join('')}
                </ul>
              </div>
            `).join('')}
          </div>
        </div>
      </section>

      <section id="skills" style="margin-bottom:32px">
        <h3 style="margin-bottom:16px;font-size:1.3rem">🧠 技能矩阵</h3>
        <div class="grid">
          ${resume.skills.map(s => `
            <div class="card">
              <h4 style="margin-bottom:10px;color:var(--c-primary)">${s.cat}</h4>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                ${s.tags.map(t => `<span class="badge">${t}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </section>

      <section id="education" style="margin-bottom:32px">
        <h3 style="margin-bottom:16px;font-size:1.3rem">🎓 教育背景</h3>
        <div class="timeline">
          ${resume.education.map(e => `
            <div class="timeline-item" style="${e.future ? 'opacity:0.75' : ''}">
              <strong>${e.title}</strong>
              <div style="color:var(--c-text2)">${e.sub}</div>
              <small>${e.date}</small>
            </div>
          `).join('')}
        </div>
      </section>
    `;

    document.getElementById('footer').innerHTML = `© ${resume.name} · 更新于2026年8月 · 广州`;

    // 邮箱复制
    document.getElementById('copyEmail').addEventListener('click', () => {
      const email = resume.emailUser + '@' + resume.emailDomain;
      navigator.clipboard?.writeText(email).then(() => alert('邮箱已复制：' + email));
    });

    // 主题切换
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    // 打印
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    // 标签页切换 (支持键盘左右)
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const panel = this.closest('.tabs').querySelector('.tab-panel');
        document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected', 'false'));
        this.setAttribute('aria-selected', 'true');
        panel.setAttribute('aria-hidden', 'false');
      });
    });

    // 平滑滚动
    document.querySelectorAll('.nav a[href^="#"]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth'});
      });
    });
  </script>
</body>
</html>
